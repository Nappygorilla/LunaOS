[profile]
id = "battery-saver"
name = "Battery saver"
category = "Power"
description = "Power-saver profile with security and privacy protections enabled."

[modules]
security = true
privacy = true
performance = true
gaming = false
coding = false
creator = false

[settings]
power_profile = "power-saver"
swappiness = 60

[sysctl]
"kernel.kptr_restrict" = 2
"kernel.dmesg_restrict" = 1
